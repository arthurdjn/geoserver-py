[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoserver"]

[tool.hatch.build.targets.sdist]
include = ["/geoserver", "/LICENSE", "/README.md", "/pyproject.toml"]

[project]
name = "geoserver-py"
version = "0.2.1"
description = "Minimal python client to communicate with Geoserver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arthur Dujardin", email = "arthurdujardin.github@gmail.com" },
]
maintainers = [
    { name = "Arthur Dujardin", email = "arthurdujardin.github@gmail.com" },
]
keywords = ["geoserver", "python", "client", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0,<3.0.0", "typing-extensions>=4.12.1,<5.0.0"]

[project.urls]
Homepage = "https://github.com/arthurdjn/geoserver-py/"
Repository = "https://github.com/arthurdjn/geoserver-py/"
Documentation = "https://github.com/arthurdjn/geoserver-py/"
Changelog = "https://github.com/arthurdjn/geoserver-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.6",
    "mkdocstrings-python>=1.8.0",
    "types-requests>=2.31.0.20240125",
    "ipykernel>=6.29.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "seaborn>=0.13.2",
    "mkdocs-jupyter>=0.24.7",
    "mkdocs-simple-hooks>=0.1.5",
    "mkdocs-exclude>=1.0.2",
    "nbconvert>=7.16.4",
    "dict2xml>=1.7.5",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
exclude-newer = "14 days"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"geoserver/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["geoserver"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "tests"
check_untyped_defs = true
implicit_reexport = true

[tool.pytest.ini_options]
addopts = ["--capture=no", "--color=yes", "-vv"]

[tool.coverage.run]
source = ["geoserver"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == '__main__'",
]
