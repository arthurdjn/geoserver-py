name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # check-out repo and set-up python
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Setup services with docker compose
      - name: Setup env config
        run: |
          cp .env.example .env
          sed -i 's/GEOSERVER_HOST=localhost/GEOSERVER_HOST=127.0.0.1/' .env
          sed -i 's/POSTGRES_HOST=localhost/POSTGRES_HOST=127.0.0.1/' .env

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 300 geoserver postgis

      - name: Install all dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          # Fail instead of skipping every test when GeoServer is not reachable.
          GEOSERVER_REQUIRED: "1"
        run: uv run --no-sync pytest tests/ --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v2
        with:
          fail_ci_if_error: false

  # Package gate: build the distributions and import from a bare wheel install (no dev group), so an
  # undeclared runtime dependency or a packaging mistake fails here instead of in the publish workflow.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel and sdist
        run: uv build

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - name: Import from a bare wheel install
        run: |
          uv venv .venv-bare
          VIRTUAL_ENV=$PWD/.venv-bare uv pip install dist/*.whl
          .venv-bare/bin/python -c "import geoserver; print(geoserver.__version__); geoserver.GeoServer; geoserver.GeoWebCache"
