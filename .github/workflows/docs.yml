name: Documentation

on:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package + docs tooling
        run: uv sync --frozen

      - name: Build docs
        run: uv run --no-sync mkdocs build

      - name: Publish docs
        run: uv run --no-sync mkdocs gh-deploy --force
